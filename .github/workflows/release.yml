name: Release

on:
  push:
    branches: [ master ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read current version and derive release version
        id: versions
        run: |
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$CURRENT" != *-SNAPSHOT ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RELEASE=${CURRENT%-SNAPSHOT}
          PATCH=${RELEASE##*.}
          NEXT_PATCH=$((PATCH + 1))
          BASE=${RELEASE%.*}
          NEXT_SNAPSHOT="${BASE}.${NEXT_PATCH}-SNAPSHOT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "next_snapshot=${NEXT_SNAPSHOT}" >> "$GITHUB_OUTPUT"

      - name: Set release version in pom.xml
        if: steps.versions.outputs.skip != 'true'
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.versions.outputs.release }} -DgenerateBackupPoms=false

      - name: Build and deploy release artifact
        if: steps.versions.outputs.skip != 'true'
        run: mvn --batch-mode --no-transfer-progress deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit release pom.xml and create tag
        if: steps.versions.outputs.skip != 'true'
        run: |
          git add pom.xml
          git commit -m "chore(release): ${{ steps.versions.outputs.release }}"
          git tag v${{ steps.versions.outputs.release }}

      - name: Set next snapshot version in pom.xml
        if: steps.versions.outputs.skip != 'true'
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.versions.outputs.next_snapshot }} -DgenerateBackupPoms=false

      - name: Commit snapshot pom.xml and push all
        if: steps.versions.outputs.skip != 'true'
        run: |
          git add pom.xml
          git commit -m "chore(snapshot): ${{ steps.versions.outputs.next_snapshot }}"
          git push origin master
          git push origin v${{ steps.versions.outputs.release }}

      - name: Create GitHub Release
        if: steps.versions.outputs.skip != 'true'
        run: gh release create v${{ steps.versions.outputs.release }} --title "v${{ steps.versions.outputs.release }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
